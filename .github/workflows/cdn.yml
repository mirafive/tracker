name: CDN

# Builds cdn/Dockerfile, pushes it to the registry the Coolify app pulls from, deploys it and checks
# cdn.mirafive.io serves this version. Runs after every release; by hand: gh workflow run cdn.yml --ref vX.Y.Z
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: cdn
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mirafive/cdn

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Coolify app pulls :latest; the sha tag is there to roll back to.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cdn/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=cdn.mirafive.io: the MIRA FIVE tracker served by nginx

      # Through the API: the Coolify CLI still sends GET to /deploy, which 4.3 refuses.
      - name: Deploy on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP: ${{ vars.COOLIFY_CDN_APP }}
        run: |
          deployment=$(curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP&force=false" | jq -r '.deployments[0].deployment_uuid')
          echo "deployment $deployment"
          for _ in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r .status)
            echo "status $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::deployment did not finish in 10 minutes"
          exit 1

      - name: cdn.mirafive.io serves this version
        run: |
          want=$(jq -r .version package.json)
          for _ in $(seq 1 12); do
            got=$(curl -fsS "https://cdn.mirafive.io/manifest.json?ci=$GITHUB_RUN_ID" | jq -r .version) && [ "$got" = "$want" ] && exit 0
            sleep 5
          done
          echo "::error::cdn.mirafive.io serves ${got:-nothing}, expected $want"
          exit 1
