name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # The tests run the built files, so build comes first.
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Package (publint)
        run: bunx publint --strict
      - name: Size
        run: bunx size-limit
      - name: Real browser (installed Chrome)
        run: bun run test:browser
