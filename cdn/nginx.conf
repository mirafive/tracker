server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Every file ships with a .gz next to it (Dockerfile), so nothing is compressed per request.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed: the pinned loader and the chunks. Chunks load with crossorigin + SRI, so they need CORS.
    location ~ "^/(mira|chunks/[a-z]+)\.[A-Za-z0-9_-]{8}\.js$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pasted into script tags, so it can never be immutable; an hour bounds how long a fixed bug is served.
    location = /mira.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # The pre-1.0 c.js/f.js, served until the app no longer accepts their wire. Delete with cdn/legacy/.
    location ~ "^/(c|f)\.[0-9a-f]{8}\.js$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ "^/(c|f)\.js$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
